          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.1.2.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1.2 (NeoForge)
          curseforge-version: ${{ env.RELEASE_VERSION }}+neoforge-mc26.1.2
          curseforge-version-type: release
          curseforge-loaders: neoforge
          curseforge-environment: client
          curseforge-game-versions: 26.1.2
          curseforge-game-version-filter: none
          curseforge-changelog: ${{ env.RELEASE_NOTES }}

      - name: Publish NeoForge 26.2 to CurseForge
        if: contains(fromJSON(steps.targets.outputs.targets), 'neoforge-26.2') && (github.event_name == 'push' || inputs.publish_curseforge)
