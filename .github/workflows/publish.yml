name: Publish Facet v1.2.11 to CurseForge

on:
  push:
    tags:
      - v1.2.11
  workflow_dispatch:
    inputs:
      publish_fabric:
        description: Publish Fabric 26.1 and 26.2 (leave disabled when retrying NeoForge only)
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish Fabric and NeoForge builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out v1.2.11
        uses: actions/checkout@v4
        with:
          ref: v1.2.11

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build release artifacts
        run: >-
          ./gradlew
          :versions:fabric-26.1:build
          :versions:fabric-26.2:build
          :versions:neoforge-26.1:build
          :versions:neoforge-26.1.2:build
          :versions:neoforge-26.2:build
          --no-daemon
          --console=plain

      - name: Publish Fabric 26.1
        if: github.event_name == 'push' || inputs.publish_fabric
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: versions/fabric-26.1/build/libs/Facet-Fabric-1.2.11-26.1.jar
          curseforge-name: Facet 1.2.11 for Minecraft 26.1
          curseforge-version: 1.2.11+mc26.1
          curseforge-version-type: release
          curseforge-loaders: fabric
          curseforge-environment: client
          curseforge-game-versions: |
            26.1
            26.1.1
            26.1.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet 1.2.11 for Minecraft 26.1 through 26.1.2.

      - name: Publish Fabric 26.2
        if: github.event_name == 'push' || inputs.publish_fabric
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: versions/fabric-26.2/build/libs/Facet-Fabric-1.2.11-26.2.jar
          curseforge-name: Facet 1.2.11 for Minecraft 26.2
          curseforge-version: 1.2.11+mc26.2
          curseforge-version-type: release
          curseforge-loaders: fabric
          curseforge-environment: client
          curseforge-game-versions: 26.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet 1.2.11 for Minecraft 26.2.

      - name: Publish NeoForge 26.1
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: versions/neoforge-26.1/build/libs/Facet-NeoForge-1.2.11-26.1.jar
          curseforge-name: Facet 1.2.11 for Minecraft 26.1 (NeoForge)
          curseforge-version: 1.2.11+neoforge-mc26.1
          curseforge-version-type: release
          curseforge-loaders: neoforge
          curseforge-environment: client
          curseforge-game-versions: 26.1
          curseforge-game-version-filter: none
          curseforge-changelog: Facet 1.2.11 for Minecraft 26.1 on NeoForge.

      - name: Publish NeoForge 26.1.2
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: versions/neoforge-26.1.2/build/libs/Facet-NeoForge-1.2.11-26.1.2.jar
          curseforge-name: Facet 1.2.11 for Minecraft 26.1.2 (NeoForge)
          curseforge-version: 1.2.11+neoforge-mc26.1.2
          curseforge-version-type: release
          curseforge-loaders: neoforge
          curseforge-environment: client
          curseforge-game-versions: 26.1.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet 1.2.11 for Minecraft 26.1.2 on NeoForge.

      - name: Publish NeoForge 26.2
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: versions/neoforge-26.2/build/libs/Facet-NeoForge-1.2.11-26.2.jar
          curseforge-name: Facet 1.2.11 for Minecraft 26.2 (NeoForge)
          curseforge-version: 1.2.11+neoforge-mc26.2
          curseforge-version-type: release
          curseforge-loaders: neoforge
          curseforge-environment: client
          curseforge-game-versions: 26.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet 1.2.11 for Minecraft 26.2 on NeoForge.
