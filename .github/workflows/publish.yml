        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.3.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.3 (NeoForge)
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
