          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.1.2.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1.2 (NeoForge)
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
          modrinth-loaders: neoforge
          modrinth-environment: client
          modrinth-game-versions: 26.1.2
