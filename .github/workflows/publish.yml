          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.1.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1 (NeoForge)
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
          modrinth-loaders: neoforge
          modrinth-environment: client
          modrinth-game-versions: 26.1
          modrinth-game-version-filter: none
          modrinth-changelog: ${{ env.RELEASE_NOTES }}

      - name: Publish NeoForge 26.1.2 to Modrinth
        if: contains(fromJSON(steps.targets.outputs.targets), 'neoforge-26.1.2') && (github.event_name == 'push' || inputs.publish_modrinth)
        uses: Kira-NT/mc-publish@v3
        with:
