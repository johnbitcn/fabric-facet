name: Publish Facet release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v1.2.3
        required: true
        type: string
      publish_github_release:
        description: Create or replace GitHub Release assets
        required: false
        type: boolean
        default: false
      publish_curseforge:
        description: Publish supported release builds to CurseForge
        required: false
        type: boolean
        default: false
      publish_modrinth:
        description: Publish all builds to Modrinth
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate release tag and project version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use v<major>.<minor>.<patch>: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          release_version="${RELEASE_TAG#v}"
          project_version="$(awk -F= '/^mod_version=/{print $2; exit}' gradle.properties)"
          if [ "$release_version" != "$project_version" ]; then
            echo "Tag $RELEASE_TAG does not match mod_version=$project_version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Build all release artifacts once
        run: >-
          ./gradlew
          :versions:fabric-26.1:build
          :versions:fabric-26.2:build
          :versions:fabric-26.3-snapshot-6:build
          :versions:neoforge-26.1:build
          :versions:neoforge-26.1.2:build
          :versions:neoforge-26.2:build
          --no-daemon
          --console=plain

      - name: Stage release files and create SHA-256 manifest
        shell: bash
        run: |
          mkdir release
          cp "versions/fabric-26.1/build/libs/Facet-Fabric-${RELEASE_VERSION}-26.1.jar" release/
          cp "versions/fabric-26.2/build/libs/Facet-Fabric-${RELEASE_VERSION}-26.2.jar" release/
          cp "versions/fabric-26.3-snapshot-6/build/libs/Facet-Fabric-${RELEASE_VERSION}-26.3-snapshot-6.jar" release/
          cp "versions/neoforge-26.1/build/libs/Facet-NeoForge-${RELEASE_VERSION}-26.1.jar" release/
          cp "versions/neoforge-26.1.2/build/libs/Facet-NeoForge-${RELEASE_VERSION}-26.1.2.jar" release/
          cp "versions/neoforge-26.2/build/libs/Facet-NeoForge-${RELEASE_VERSION}-26.2.jar" release/
          (
            cd release
            sha256sum *.jar | sort > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Archive exact release files
        uses: actions/upload-artifact@v4
        with:
          name: Facet-${{ env.RELEASE_TAG }}-release-artifacts
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --title "Facet v${RELEASE_VERSION}" --generate-notes
          fi

      - name: Verify GitHub Release asset checksums
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir verified-release
          gh release download "$RELEASE_TAG" --dir verified-release --pattern '*.jar' --pattern SHA256SUMS.txt
          (
            cd verified-release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Verify local release manifest before third-party publishing
        if: github.event_name == 'push' || inputs.publish_curseforge || inputs.publish_modrinth
        run: (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish Fabric 26.1 to CurseForge
        if: github.event_name == 'push' || inputs.publish_curseforge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.1.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1
          curseforge-version: ${{ env.RELEASE_VERSION }}+mc26.1
          curseforge-version-type: release
          curseforge-loaders: fabric
          curseforge-environment: client
          curseforge-game-versions: |
            26.1
            26.1.1
            26.1.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1 through 26.1.2.

      - name: Publish Fabric 26.2 to CurseForge
        if: github.event_name == 'push' || inputs.publish_curseforge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.2.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2
          curseforge-version: ${{ env.RELEASE_VERSION }}+mc26.2
          curseforge-version-type: release
          curseforge-loaders: fabric
          curseforge-environment: client
          curseforge-game-versions: 26.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2.

      - name: Publish NeoForge 26.1 to CurseForge
        if: github.event_name == 'push' || inputs.publish_curseforge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.1.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1 (NeoForge)
          curseforge-version: ${{ env.RELEASE_VERSION }}+neoforge-mc26.1
          curseforge-version-type: release
          curseforge-loaders: neoforge
          curseforge-environment: client
          curseforge-game-versions: 26.1
          curseforge-game-version-filter: none
          curseforge-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1 on NeoForge.

      - name: Publish NeoForge 26.1.2 to CurseForge
        if: github.event_name == 'push' || inputs.publish_curseforge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.1.2.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1.2 (NeoForge)
          curseforge-version: ${{ env.RELEASE_VERSION }}+neoforge-mc26.1.2
          curseforge-version-type: release
          curseforge-loaders: neoforge
          curseforge-environment: client
          curseforge-game-versions: 26.1.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1.2 on NeoForge.

      - name: Publish NeoForge 26.2 to CurseForge
        if: github.event_name == 'push' || inputs.publish_curseforge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.2.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2 (NeoForge)
          curseforge-version: ${{ env.RELEASE_VERSION }}+neoforge-mc26.2
          curseforge-version-type: release
          curseforge-loaders: neoforge
          curseforge-environment: client
          curseforge-game-versions: 26.2
          curseforge-game-version-filter: none
          curseforge-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2 on NeoForge.

      - name: Publish Fabric 26.1 to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.1.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
          modrinth-loaders: fabric
          modrinth-environment: client
          modrinth-game-versions: |
            26.1
            26.1.1
            26.1.2
          modrinth-game-version-filter: none
          modrinth-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1 through 26.1.2.

      - name: Publish Fabric 26.2 to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.2.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
          modrinth-loaders: fabric
          modrinth-environment: client
          modrinth-game-versions: 26.2
          modrinth-game-version-filter: none
          modrinth-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2.

      - name: Publish Fabric 26.3 Snapshot 6 to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.3-snapshot-6.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.3 Snapshot 6
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: beta
          modrinth-loaders: fabric
          modrinth-environment: client
          modrinth-game-versions: 26.3-snapshot-6
          modrinth-game-version-filter: none
          modrinth-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.3 Snapshot 6.

      - name: Publish NeoForge 26.1 to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.1.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1 (NeoForge)
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
          modrinth-loaders: neoforge
          modrinth-environment: client
          modrinth-game-versions: 26.1
          modrinth-game-version-filter: none
          modrinth-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1 on NeoForge.

      - name: Publish NeoForge 26.1.2 to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.1.2.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1.2 (NeoForge)
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
          modrinth-loaders: neoforge
          modrinth-environment: client
          modrinth-game-versions: 26.1.2
          modrinth-game-version-filter: none
          modrinth-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1.2 on NeoForge.

      - name: Publish NeoForge 26.2 to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-NeoForge-${{ env.RELEASE_VERSION }}-26.2.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2 (NeoForge)
          modrinth-version: ${{ env.RELEASE_VERSION }}
          modrinth-version-type: release
          modrinth-loaders: neoforge
          modrinth-environment: client
          modrinth-game-versions: 26.2
          modrinth-game-version-filter: none
          modrinth-changelog: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2 on NeoForge.
