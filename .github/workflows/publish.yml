name: Publish Facet release

on:
  push:
    tags:
      - 'v*'
      - '!v*-preview.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v1.2.3
        required: true
        type: string
      publish_github_release:
        description: Create or replace GitHub Release assets
        required: false
        type: boolean
        default: false
      publish_curseforge:
        description: Publish supported release builds to CurseForge
        required: false
        type: boolean
        default: false
      publish_modrinth:
        description: Publish all builds to Modrinth
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate release tag and project version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use v<major>.<minor>.<patch>: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          release_version="${RELEASE_TAG#v}"
          project_version="$(awk -F= '/^mod_version=/{print $2; exit}' gradle.properties)"
          if [ "$release_version" != "$project_version" ]; then
            echo "Tag $RELEASE_TAG does not match mod_version=$project_version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Load release notes
        shell: bash
        run: |
          {
            echo 'RELEASE_NOTES<<FACET_RELEASE_NOTES'
            if [ -f "release-notes/${RELEASE_TAG}.md" ]; then
              cat "release-notes/${RELEASE_TAG}.md"
            else
              echo "Facet ${RELEASE_VERSION}."
            fi
            echo 'FACET_RELEASE_NOTES'
          } >> "$GITHUB_ENV"

      - name: Test Modrinth description sync
        if: hashFiles('scripts/test-modrinth-description.py') != ''
        run: python3 scripts/test-modrinth-description.py

      - name: Test release target selection
        run: python3 scripts/test-release-targets.py

      - name: Load explicit release targets
        id: targets
        shell: bash
        run: |
          targets_text="$(python3 scripts/release-targets.py "release-notes/${RELEASE_TAG}.targets")"
          targets_json="$(printf '%s\n' "$targets_text" | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().splitlines()))')"
          echo "targets=$targets_json" >> "$GITHUB_OUTPUT"
          printf 'Selected release targets:\n%s\n' "$targets_text" >> "$GITHUB_STEP_SUMMARY"

      - name: Build selected release artifacts once
        shell: bash
        run: |
          targets_text="$(python3 scripts/release-targets.py "release-notes/${RELEASE_TAG}.targets")"
          build_tasks=()
          while IFS= read -r target; do
            build_tasks+=(":versions:$target:build")
          done <<< "$targets_text"
          ./gradlew "${build_tasks[@]}" --no-daemon --console=plain

      - name: Stage release files and create SHA-256 manifest
        shell: bash
        run: |
          mkdir release
          targets_text="$(python3 scripts/release-targets.py "release-notes/${RELEASE_TAG}.targets")"
          while IFS= read -r target; do
            loader="${target%%-*}"
            minecraft_version="${target#*-}"
            if [[ "$loader" == "fabric" ]]; then
              archive_name=Facet-Fabric
            else
              archive_name=Facet-NeoForge
            fi
            cp "versions/$target/build/libs/${archive_name}-${RELEASE_VERSION}-${minecraft_version}.jar" release/
          done <<< "$targets_text"
          TARGETS_TEXT="$targets_text" python3 - <<'PY'
          import json, os, pathlib, tomllib, zipfile
          properties = dict(line.split("=", 1) for line in pathlib.Path("gradle.properties").read_text().splitlines()
                            if line and not line.startswith("#"))
          for target in os.environ["TARGETS_TEXT"].splitlines():
              loader, minecraft = target.split("-", 1)
              key = minecraft.replace(".", "_")
              archive = "Facet-Fabric" if loader == "fabric" else "Facet-NeoForge"
              jar = pathlib.Path("release") / f"{archive}-{os.environ['RELEASE_VERSION']}-{minecraft}.jar"
              with zipfile.ZipFile(jar) as z:
                  if loader == "fabric":
                      metadata = json.loads(z.read("fabric.mod.json"))
                      assert metadata["depends"]["fabricloader"] == ">=" + properties["loader_min_version_" + key]
                      assert metadata["depends"]["fabric-api"] == ">=" + properties["fabric_api_min_version_" + key]
                  else:
                      metadata = tomllib.loads(z.read("META-INF/neoforge.mods.toml").decode())
                      dependency = next(d for d in metadata["dependencies"]["facet"] if d["modId"] == "neoforge")
                      assert dependency["versionRange"] == "[" + properties["neo_min_version_" + key] + ",)"
          PY
          (
            cd release
            sha256sum *.jar | sort > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Archive exact release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Facet-${{ env.RELEASE_TAG }}-release-artifacts
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Update Modrinth project description
        if: (github.event_name == 'push' || inputs.publish_modrinth) && hashFiles('scripts/update-modrinth-description.py') != ''
        env:
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/update-modrinth-description.py

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" release/* --title "Facet v${RELEASE_VERSION}" --notes "$RELEASE_NOTES"
          fi

      - name: Verify GitHub Release asset checksums
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir verified-release
          gh release download "$RELEASE_TAG" --dir verified-release --pattern '*.jar' --pattern SHA256SUMS.txt
          (
            cd verified-release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Verify local release manifest before third-party publishing
        if: github.event_name == 'push' || inputs.publish_curseforge || inputs.publish_modrinth
        run: (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish Fabric 26.1 to CurseForge
        if: contains(fromJSON(steps.targets.outputs.targets), 'fabric-26.1') && (github.event_name == 'push' || inputs.publish_curseforge)
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.1.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.1
          curseforge-version: ${{ env.RELEASE_VERSION }}+mc26.1
          curseforge-version-type: release
          curseforge-loaders: fabric
          curseforge-environment: client
          curseforge-game-versions: |
            26.1
            26.1.1
            26.1.2
          curseforge-game-version-filter: none
          curseforge-changelog: ${{ env.RELEASE_NOTES }}

      - name: Publish Fabric 26.2 to CurseForge
        if: contains(fromJSON(steps.targets.outputs.targets), 'fabric-26.2') && (github.event_name == 'push' || inputs.publish_curseforge)
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.2.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.2
          curseforge-version: ${{ env.RELEASE_VERSION }}+mc26.2
          curseforge-version-type: release
          curseforge-loaders: fabric
          curseforge-environment: client
          curseforge-game-versions: 26.2
          curseforge-game-version-filter: none
          curseforge-changelog: ${{ env.RELEASE_NOTES }}

      - name: Publish Fabric 26.3 to CurseForge
        if: contains(fromJSON(steps.targets.outputs.targets), 'fabric-26.3') && (github.event_name == 'push' || inputs.publish_curseforge)
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.3.jar
          curseforge-name: Facet ${{ env.RELEASE_VERSION }} for Minecraft 26.3
          curseforge-version: ${{ env.RELEASE_VERSION }}+mc26.3
          curseforge-version-type: release
          curseforge-loaders: fabric
          curseforge-environment: client
          curseforge-game-versions: 26.3
          curseforge-game-version-filter: none
          curseforge-changelog: ${{ env.RELEASE_NOTES }}

      - name: Publish NeoForge 26.1 to CurseForge
