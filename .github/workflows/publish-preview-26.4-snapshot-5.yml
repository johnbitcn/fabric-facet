name: Publish Minecraft 26.4 Snapshot 5 preview

on:
  push:
    tags:
      - 'v*-mc26.4-snapshot-5-preview.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Snapshot 5 preview tag to recover
        required: true
        type: string
      publish_github_release:
        description: Create or replace GitHub prerelease assets
        type: boolean
        default: false
      publish_modrinth:
        description: Publish the preview to Modrinth
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out preview tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate preview tag and project version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-mc26\.4-snapshot-5-preview\.([0-9]+)$ ]]; then
            echo "Invalid Snapshot 5 preview tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"
          preview_number="${BASH_REMATCH[2]}"
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          project_version="$(awk -F= '/^mod_version=/{print $2; exit}' gradle.properties)"
          if [ "$release_version" != "$project_version" ]; then
            echo "Tag does not match mod_version=$project_version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION=${release_version}-s5-preview.${preview_number}" >> "$GITHUB_ENV"

      - name: Load preview release notes
        shell: bash
        run: |
          notes_file="release-notes/${RELEASE_TAG}.md"
          test -s "$notes_file"
          cp "$notes_file" "$RUNNER_TEMP/release-notes.md"
          {
            echo 'RELEASE_NOTES<<FACET_RELEASE_NOTES'
            cat "$notes_file"
            echo 'FACET_RELEASE_NOTES'
          } >> "$GITHUB_ENV"

      - name: Test Modrinth description sync
        if: hashFiles('scripts/test-modrinth-description.py') != ''
        run: python3 scripts/test-modrinth-description.py

      - name: Build Snapshot 5 preview
        run: ./gradlew -PincludeSnapshots=true :versions:fabric-26.4-snapshot-5:build --no-daemon --console=plain

      - name: Stage and validate preview artifact
        shell: bash
        run: |
          mkdir release
          cp "versions/fabric-26.4-snapshot-5/build/libs/Facet-Fabric-${RELEASE_VERSION}-26.4-snapshot-5.jar" release/
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          properties = dict(line.split("=", 1) for line in pathlib.Path("gradle.properties").read_text().splitlines()
                            if line and not line.startswith("#"))
          jars = list(pathlib.Path("release").glob("*.jar"))
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as jar:
              assert jar.testzip() is None
              metadata = json.loads(jar.read("fabric.mod.json"))
              assert metadata["version"] == os.environ["RELEASE_VERSION"]
              assert metadata["depends"]["minecraft"] == "26.4-alpha.5"
              assert metadata["depends"]["fabricloader"] == ">=" + properties["loader_min_version_26_4_snapshot_5"]
              assert metadata["depends"]["fabric-api"] == ">=" + properties["fabric_api_min_version_26_4_snapshot_5"]
          PY
          (
            cd release
            sha256sum *.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Archive exact preview files
        uses: actions/upload-artifact@v4
        with:
          name: Facet-${{ env.RELEASE_TAG }}-preview-artifacts
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Update Modrinth project description
        if: (github.event_name == 'push' || inputs.publish_modrinth) && hashFiles('scripts/update-modrinth-description.py') != ''
        env:
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/update-modrinth-description.py

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag \
              --title "Facet v${RELEASE_VERSION} Minecraft 26.4 Snapshot 5 Alpha Preview" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi

      - name: Verify GitHub prerelease asset checksums
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir verified-release
          gh release download "$RELEASE_TAG" --dir verified-release --pattern '*.jar' --pattern SHA256SUMS.txt
          (cd verified-release && sha256sum --check SHA256SUMS.txt)

      - name: Verify manifest before Modrinth publishing
        if: github.event_name == 'push' || inputs.publish_modrinth
        run: (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish Snapshot 5 Alpha preview to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.4-snapshot-5.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} Preview for Minecraft 26.4 Snapshot 5
          modrinth-version: ${{ env.PREVIEW_VERSION }}
          modrinth-version-type: alpha
          modrinth-loaders: fabric
          modrinth-environment: client
          modrinth-game-versions: 26.4-snapshot-5
          modrinth-game-version-filter: none
          modrinth-changelog: ${{ env.RELEASE_NOTES }}
