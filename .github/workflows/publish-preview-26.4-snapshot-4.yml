name: Publish Minecraft 26.4 Snapshot 4 preview

on:
  push:
    tags:
      - 'v*-mc26.4-snapshot-4-preview.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Snapshot 4 preview tag to recover
        required: true
        type: string
      publish_github_release:
        description: Create or replace GitHub prerelease assets
        type: boolean
        default: false
      publish_modrinth:
        description: Publish the preview to Modrinth
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out preview tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate preview tag and project version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-mc26\.4-snapshot-4-preview\.([0-9]+)$ ]]; then
            echo "Invalid Snapshot 4 preview tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"
          preview_number="${BASH_REMATCH[2]}"
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          project_version="$(awk -F= '/^mod_version=/{print $2; exit}' gradle.properties)"
          if [ "$release_version" != "$project_version" ]; then
            echo "Tag does not match mod_version=$project_version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION=${release_version}-s4-preview.${preview_number}" >> "$GITHUB_ENV"

      - name: Build Snapshot 4 preview
        run: ./gradlew -PincludeSnapshots=true :versions:fabric-26.4-snapshot-4:build --no-daemon --console=plain

      - name: Stage and validate preview artifact
        shell: bash
        run: |
          mkdir release
          cp "versions/fabric-26.4-snapshot-4/build/libs/Facet-Fabric-${RELEASE_VERSION}-26.4-snapshot-4.jar" release/
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          jars = list(pathlib.Path("release").glob("*.jar"))
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as jar:
              assert jar.testzip() is None
              metadata = json.loads(jar.read("fabric.mod.json"))
              assert metadata["version"] == os.environ["RELEASE_VERSION"]
              assert metadata["depends"]["minecraft"] == "26.4-alpha.4"
          PY
          (
            cd release
            sha256sum *.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Fabric compatibility preview for Minecraft 26.4 Snapshot 4 (Alpha).

          - Added support for Minecraft 26.4 Snapshot 4.
          - Includes the block-outline performance improvements from Facet 1.6.1.
          - Water and lava show static translucent flow-direction arrows.
          - Holographic placement preview provides night vision.
          - Lava is translucent with clearer interior fog.
          EOF

      - name: Archive exact preview files
        uses: actions/upload-artifact@v4
        with:
          name: Facet-${{ env.RELEASE_TAG }}-preview-artifacts
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag \
              --title "Facet v${RELEASE_VERSION} Minecraft 26.4 Snapshot 4 Alpha Preview" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi

      - name: Verify GitHub prerelease asset checksums
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir verified-release
          gh release download "$RELEASE_TAG" --dir verified-release --pattern '*.jar' --pattern SHA256SUMS.txt
          (cd verified-release && sha256sum --check SHA256SUMS.txt)

      - name: Verify manifest before Modrinth publishing
        if: github.event_name == 'push' || inputs.publish_modrinth
        run: (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish Snapshot 4 Alpha preview to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-Fabric-${{ env.RELEASE_VERSION }}-26.4-snapshot-4.jar
          modrinth-name: Facet ${{ env.RELEASE_VERSION }} Preview for Minecraft 26.4 Snapshot 4
          modrinth-version: ${{ env.PREVIEW_VERSION }}
          modrinth-version-type: alpha
          modrinth-loaders: fabric
          modrinth-environment: client
          modrinth-game-versions: 26.4-snapshot-4
          modrinth-game-version-filter: none
          modrinth-changelog: |
            Fabric compatibility preview for Minecraft 26.4 Snapshot 4 (Alpha).

            - Added support for Minecraft 26.4 Snapshot 4.
            - Includes the block-outline performance improvements from Facet 1.6.1.
            - Water and lava show static translucent flow-direction arrows.
            - Holographic placement preview provides night vision.
            - Lava is translucent with clearer interior fog.
