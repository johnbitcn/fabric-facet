name: Publish Facet compatibility preview for Snapshot 7

on:
  push:
    tags:
      - 'v*-mc26.3-snapshot-7-preview.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Snapshot 7 Preview tag to recover
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Minecraft 26.3 Snapshot 7 preview
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out preview tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate preview tag and project version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-mc26\.3-snapshot-7-preview\.([0-9]+)$ ]]; then
            echo "Preview tag must use v<version>-mc26.3-snapshot-7-preview.<number>: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          release_version="${BASH_REMATCH[1]}"
          preview_number="${BASH_REMATCH[2]}"
          project_version="$(awk -F= '/^mod_version=/{print $2; exit}' gradle.properties)"
          if [ "$release_version" != "$project_version" ]; then
            echo "Tag $RELEASE_TAG does not match mod_version=$project_version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION=${release_version}-s7-preview.${preview_number}" >> "$GITHUB_ENV"

      - name: Build Snapshot 7 preview artifact
        run: >-
          ./gradlew
          :versions:fabric-26.3-snapshot-7:build
          --no-daemon
          --console=plain

      - name: Stage preview files and create SHA-256 manifest
        shell: bash
        run: |
          mkdir release
          cp "versions/fabric-26.3-snapshot-7/build/libs/Facet-Fabric-${RELEASE_VERSION}-26.3-snapshot-7.jar" release/
          (
            cd release
            sha256sum *.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Compatibility preview for Minecraft 26.3 Snapshot 7 on Fabric.

          - Adds the Snapshot 7 rendering and shader compatibility path.
          - Keeps hologram previews behind translucent terrain in classic transparency and integrates them with native OIT when Improved Transparency is enabled.
          - Includes the verified RenderPass lifecycle fix for hover outlines and placement previews.
          - In-game validation completed for the accepted Snapshot 7 candidate. Vulkan is not included in this preview's validation scope.
          EOF

      - name: Archive exact preview files
        uses: actions/upload-artifact@v4
        with:
          name: Facet-${{ env.RELEASE_TAG }}-preview-artifacts
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG"
          release/*
          --verify-tag
          --title "Facet v${RELEASE_VERSION} Preview"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --prerelease

      - name: Verify GitHub prerelease asset checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir verified-release
          gh release download "$RELEASE_TAG" --dir verified-release --pattern '*.jar' --pattern SHA256SUMS.txt
          (
            cd verified-release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Publish Snapshot 7 preview to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release/Facet-Fabric-${RELEASE_VERSION}-26.3-snapshot-7.jar
          modrinth-name: Facet ${RELEASE_VERSION} Preview for Minecraft 26.3 Snapshot 7
          modrinth-version: ${{ env.PREVIEW_VERSION }}
          modrinth-version-type: beta
          modrinth-loaders: fabric
          modrinth-environment: client
          modrinth-game-versions: 26.3-snapshot-7
          modrinth-game-version-filter: none
          modrinth-changelog: Minecraft 26.3 Snapshot 7 compatibility preview with user-accepted in-game RenderPass and transparency validation. Vulkan is not included in this preview's validation scope.
