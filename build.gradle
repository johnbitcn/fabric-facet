plugins {
	id 'base'
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'com.modrinth.minotaur' version "${minotaur_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

def versionConfigs = [
		":versions:fabric-26.1": [
				archivesName: "Facet-Fabric",
				minecraftVersion: findProperty("minecraft_version_26_1"),
				loaderMinVersion: findProperty("loader_min_version_26_1"),
				fabricApiVersion: findProperty("fabric_api_version_26_1"),
				fabricApiMinVersion: findProperty("fabric_api_min_version_26_1"),
				lifecycleEventsVersion: findProperty("lifecycle_events_version_26_1"),
				modMenuDependency: findProperty("modmenu_dependency_26_1"),
				minecraftDependency: "~26.1",
				legacyRenderer: true,
				modMenuRuntime: true,
		],
		":versions:fabric-26.2": [
				archivesName: "Facet-Fabric",
				minecraftVersion: findProperty("minecraft_version_26_2"),
				loaderMinVersion: findProperty("loader_min_version_26_2"),
				fabricApiVersion: findProperty("fabric_api_version_26_2"),
				fabricApiMinVersion: findProperty("fabric_api_min_version_26_2"),
				lifecycleEventsVersion: findProperty("lifecycle_events_version_26_2"),
				modMenuDependency: findProperty("modmenu_dependency_26_2"),
				minecraftDependency: "~26.2",
				legacyRenderer: true,
				modMenuRuntime: true,
		],
		":versions:fabric-26.3": [
				archivesName: "Facet-Fabric",
				minecraftVersion: findProperty("minecraft_version_26_3"),
				loaderMinVersion: findProperty("loader_min_version_26_3"),
				fabricApiVersion: findProperty("fabric_api_version_26_3"),
				fabricApiMinVersion: findProperty("fabric_api_min_version_26_3"),
				lifecycleEventsVersion: findProperty("lifecycle_events_version_26_3"),
				modMenuDependency: findProperty("modmenu_dependency_26_3"),
				minecraftDependency: "~26.3",
				legacyRenderer: true,
				modMenuRuntime: true,
		],
		":versions:fabric-26.4-snapshot-6": [
				archivesName: "Facet-Fabric",
				minecraftVersion: findProperty("minecraft_version_26_4_snapshot_6"),
				loaderVersion: findProperty("loader_version_26_4_snapshot_6"),
				loaderMinVersion: findProperty("loader_min_version_26_4_snapshot_6"),
				fabricApiVersion: findProperty("fabric_api_version_26_4_snapshot_6"),
				fabricApiMinVersion: findProperty("fabric_api_min_version_26_4_snapshot_6"),
				lifecycleEventsVersion: findProperty("lifecycle_events_version_26_4_snapshot_6"),
				modMenuDependency: findProperty("modmenu_dependency_26_4_snapshot_6"),
				minecraftDependency: "26.4-alpha.6",
				legacyRenderer: true,
				modMenuRuntime: false,
		],
	]

if (findProject(":versions:fabric-26.4-snapshot-6") == null) {
	versionConfigs.remove(":versions:fabric-26.4-snapshot-6")
}

allprojects {
	group = rootProject.maven_group

	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		exclusiveContent {
			forRepository {
				maven {
					name = "Terraformers"
					url = "https://maven.terraformersmc.com/"
				}
			}
			filter {
				includeGroup "com.terraformersmc"
			}
		}
		mavenCentral()
	}
}

// Authorize LWJGL native loading only in forked test JVMs, not Gradle or game runs.
subprojects {
	tasks.withType(Test).configureEach {
		jvmArgs '--enable-native-access=ALL-UNNAMED'
	}
}

versionConfigs.each { projectPath, cfg ->
	def loaderVersion = cfg.loaderVersion ?: rootProject.loader_version
	project(projectPath) {
		apply plugin: "net.fabricmc.fabric-loom"
		apply plugin: "com.modrinth.minotaur"

		version = rootProject.mod_version

		base {
			archivesName = cfg.archivesName
		}

		loom {
			splitEnvironmentSourceSets()

			mods {
				"facet" {
					sourceSet sourceSets.client
				}
			}
		}

		sourceSets {
			client {
				def javaDirs = [rootProject.file("src/outline_core/java"), rootProject.file("src/shared/java"), file("src/client/java")]
				def resourceDirs = [rootProject.file("src/outline_core/resources"), file("src/client/resources"), rootProject.file("src/shared/resources")]

				if (cfg.legacyRenderer) {
					javaDirs.add(rootProject.file("src/legacy_renderer/java"))
					resourceDirs.add(rootProject.file("src/legacy_renderer/resources"))
				}

				java.setSrcDirs(javaDirs)
				if (cfg.minecraftVersion.contains("-snapshot-")) {
					// Snapshot overrides must not change the sources compiled by stable targets.
					java.exclude { entry ->
						def override = file("src/client/java/${entry.path}")
						override.isFile() && entry.file != override
					}
				}
				resources.setSrcDirs(resourceDirs)
			}
		}

		dependencies {
			minecraft "com.mojang:minecraft:${cfg.minecraftVersion}"
			implementation "net.fabricmc:fabric-loader:${loaderVersion}"
			implementation "net.fabricmc.fabric-api:fabric-api:${cfg.fabricApiVersion}"
			implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${cfg.lifecycleEventsVersion}"
			if (cfg.modMenuRuntime) {
				implementation cfg.modMenuDependency
			} else {
				compileOnly cfg.modMenuDependency
			}
			if (projectPath in [":versions:fabric-26.2", ":versions:fabric-26.4-snapshot-6"]) {
				testImplementation platform("org.junit:junit-bom:5.12.1")
				testImplementation "org.junit.jupiter:junit-jupiter"
				testRuntimeOnly "org.junit.platform:junit-platform-launcher"
			}
		}

		if (projectPath in [":versions:fabric-26.2", ":versions:fabric-26.4-snapshot-6"]) {
			sourceSets.test.java.srcDir(rootProject.file("src/outline_core/test/java"))
			if (projectPath == ":versions:fabric-26.4-snapshot-6") {
				sourceSets.test.java.srcDir(rootProject.file("versions/fabric-26.2/src/test/java"))
				sourceSets.test.java.exclude { entry ->
					def override = file("src/test/java/${entry.path}")
					override.isFile() && entry.file != override
				}
			}
			sourceSets.test.compileClasspath += sourceSets.client.output + configurations.clientCompileClasspath
			sourceSets.test.runtimeClasspath += sourceSets.client.output + configurations.clientRuntimeClasspath
			tasks.named("test") {
				dependsOn tasks.named("compileClientJava")
				useJUnitPlatform()
			}
		}

		tasks.withType(ProcessResources).configureEach {
			duplicatesStrategy = DuplicatesStrategy.EXCLUDE
			inputs.property "version", rootProject.mod_version
			inputs.property "loader_min_version", cfg.loaderMinVersion
			inputs.property "fabric_api_min_version", cfg.fabricApiMinVersion
			inputs.property "minecraft_dependency", cfg.minecraftDependency

			filesMatching("fabric.mod.json") {
				expand(
						"version": rootProject.mod_version,
						"loader_min_version": cfg.loaderMinVersion,
						"fabric_api_min_version": cfg.fabricApiMinVersion,
						"minecraft_dependency": cfg.minecraftDependency)
			}
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = 25
		}

		tasks.withType(Jar).configureEach {
			from(rootProject.file("LICENSE")) {
				into("META-INF")
			}
		}

		tasks.matching { it.name == "remapJar" }.configureEach {
			archiveVersion.set("${rootProject.mod_version}-${cfg.minecraftVersion}")
		}

		tasks.matching { it.name == "jar" }.configureEach {
			archiveVersion.set("${rootProject.mod_version}-${cfg.minecraftVersion}")
		}

		tasks.matching { it.name == "sourcesJar" }.configureEach {
			duplicatesStrategy = DuplicatesStrategy.EXCLUDE
			archiveVersion.set("${rootProject.mod_version}-${cfg.minecraftVersion}")
		}

		java {
			withSourcesJar()
			sourceCompatibility = JavaVersion.VERSION_25
			targetCompatibility = JavaVersion.VERSION_25
		}

		afterEvaluate {
			def modrinthDebugMode = (findProperty("modrinth_debug") ?: "false").toString().toBoolean()

			modrinth {
				token = System.getenv("MODRINTH_TOKEN") ?: (modrinthDebugMode ? "debug-token" : null)
				projectId = findProperty("modrinth_project_id") ?: System.getenv("MODRINTH_PROJECT_ID")
				versionName = "${cfg.archivesName} ${rootProject.mod_version} for Minecraft ${cfg.minecraftVersion}"
				versionNumber = "${rootProject.mod_version}+mc${cfg.minecraftVersion}"
				versionType = cfg.minecraftVersion.contains("-snapshot-")
						? "alpha"
						: findProperty("modrinth_version_type") ?: "release"
				uploadFile = tasks.named("jar").get()
				gameVersions = [cfg.minecraftVersion]
				loaders = ["fabric"]
				changelog = findProperty("modrinth_changelog") ?: "Facet ${rootProject.mod_version} for Minecraft ${cfg.minecraftVersion}."
				syncBodyFrom = rootProject.file("README.md").text
				debugMode = modrinthDebugMode

				dependencies {
					required.project "fabric-api"
					optional.project "modmenu"
				}
			}

			tasks.named("modrinth") {
				dependsOn tasks.named("jar")
			}
		}
	}
}

tasks.named("build") {
	dependsOn versionConfigs.keySet().collect { "${it}:build" }
}
