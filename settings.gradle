pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'facet'

include 'versions:fabric-26.1'
include 'versions:fabric-26.2'
include 'versions:fabric-26.3-snapshot-6'
include 'versions:neoforge-26.1'
include 'versions:neoforge-26.1.2'
include 'versions:neoforge-26.2'
